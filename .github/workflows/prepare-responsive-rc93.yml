name: Prepare responsive rc93 candidate

on:
  push:
    branches:
      - fix/mobility-responsive-uniformity-rc93

permissions:
  contents: write

concurrency:
  group: mobility-responsive-rc93-preparation
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout candidate branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: fix/mobility-responsive-uniformity-rc93
          fetch-depth: 0
          persist-credentials: true
      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '24'
          cache: npm
      - name: Locked install
        run: npm ci
      - name: Synchronize candidate release identity
        run: npm run release:sync
      - name: Full owned source/contract/UX/package/release test suite
        run: npm test
      - name: Canonical-only and deterministic second-build checks
        shell: bash
        run: |
          set -euo pipefail
          node tools/audit-canonical-dependencies.mjs --fail-on-legacy
          cp -a dist /tmp/rc93-first-dist
          npm run clean
          npm run build
          diff -qr /tmp/rc93-first-dist dist
      - name: Commit exact reproducible package and remove one-off workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json COMPATIBILITY.json RELEASE_MANIFEST.json release/RELEASE_STATUS.json release/QUALIFICATION.json src/assets/metadata/mobility-visual-manifest.json dist
          git rm -f .github/workflows/prepare-responsive-rc93.yml
          git commit -m "build(mobility UX): exact reproducible rc93 HACS test candidate"
          git push origin HEAD:fix/mobility-responsive-uniformity-rc93
