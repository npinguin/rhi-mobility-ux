name: Branch package refresh
on:
  push:
    branches: [release/rc69-core151-registry-navigation]
permissions:
  contents: write
jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with: { ref: release/rc69-core151-registry-navigation }
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with: { node-version: '24' }
      - run: npm ci
      - run: npm run build
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add dist
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "build: refresh deterministic rc.69 dist"
          git push origin HEAD:release/rc69-core151-registry-navigation
