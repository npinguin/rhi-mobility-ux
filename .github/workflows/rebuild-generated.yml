name: Rebuild generated package

on:
  push:
    branches:
      - refactor/rc63-rhi-ux-core-convergence

permissions:
  contents: write

jobs:
  rebuild:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Commit generated package
        run: |
          if git diff --quiet -- dist; then
            echo "Generated package already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist
          git commit -m "Rebuild rc.63 generated package"
          git push origin HEAD:${{ github.ref_name }}
