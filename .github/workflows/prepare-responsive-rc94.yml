name: Prepare responsive rc94 candidate

on:
  push:
    branches:
      - fix/mobility-responsive-uniformity-rc94

permissions:
  contents: write

concurrency:
  group: mobility-responsive-rc94-preparation
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout candidate branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: fix/mobility-responsive-uniformity-rc94
          fetch-depth: 0
          persist-credentials: true
      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '24'
          cache: npm
      - name: Locked install
        run: npm ci
      - name: Synchronize rc94 release metadata
        run: npm run release:sync
      - name: Full contract, UX, package and release tests
        run: npm test
      - name: Canonical only and deterministic second-build check
        shell: bash
        run: |
          set -euo pipefail
          node tools/audit-canonical-dependencies.mjs --fail-on-legacy
          cp -a dist /tmp/rhi-rc94-first-dist
          npm run clean
          npm run build
          diff -qr /tmp/rhi-rc94-first-dist dist
      - name: Commit verified immutable dist source and self-remove
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json COMPATIBILITY.json RELEASE_MANIFEST.json release/RELEASE_STATUS.json release/QUALIFICATION.json src/assets/metadata/mobility-visual-manifest.json dist
          git rm -f .github/workflows/prepare-responsive-rc94.yml
          git commit -m "build(mobility UX): verified rc94 reproducible HACS candidate"
          git push origin HEAD:fix/mobility-responsive-uniformity-rc94
