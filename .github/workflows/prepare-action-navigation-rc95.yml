name: Prepare action/navigation rc95 candidate

on:
  push:
    branches: [fix/mobility-action-fact-parity-rc95]

permissions:
  contents: write

concurrency:
  group: mobility-navigation-rc95-package
  cancel-in-progress: false

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: fix/mobility-action-fact-parity-rc95
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run release:sync
      - name: Full canonical contract, render, UX and release qualification
        run: npm test
      - name: No retired contract read and second build equality
        shell: bash
        run: |
          set -euo pipefail
          node tools/audit-canonical-dependencies.mjs --fail-on-legacy
          cp -a dist /tmp/rc95-first-package
          npm run clean
          npm run build
          diff -qr /tmp/rc95-first-package dist
      - name: Commit exact validated package and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json COMPATIBILITY.json RELEASE_MANIFEST.json release/RELEASE_STATUS.json release/QUALIFICATION.json src/assets/metadata/mobility-visual-manifest.json dist
          git rm -f .github/workflows/prepare-action-navigation-rc95.yml
          git commit -m "build(mobility UX): verified rc95 immutable HACS candidate"
          git push origin HEAD:fix/mobility-action-fact-parity-rc95
