name: Sync generated dist once

on:
  push:
    branches:
      - refactor/rc63-rhi-ux-core-convergence
    paths-ignore:
      - 'dist/**'

permissions:
  contents: write

jobs:
  sync-dist:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc2c6c09
        with:
          ref: refactor/rc63-rhi-ux-core-convergence
          fetch-depth: 0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run clean && npm run build
      - name: Commit deterministic dist
        run: |
          if git diff --quiet -- dist; then
            echo "dist already synchronized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist
          git commit -m "Sync rc.63 deterministic dist"
          git push origin HEAD:refactor/rc63-rhi-ux-core-convergence
