name: Temporary sync Mobility rc70 candidate

on:
  push:
    branches:
      - fix/rc70-shared-visual-picker
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: temporary-mobility-rc70-sync-v2
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: fix/rc70-shared-visual-picker
          fetch-depth: 0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Synchronize visual manifest and release package
        run: |
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          import { buildMobilityVisualManifest } from './tools/visual-manifest.mjs';
          const pkg=JSON.parse(fs.readFileSync('package.json','utf8'));
          fs.writeFileSync('src/assets/metadata/mobility-visual-manifest.json', JSON.stringify(buildMobilityVisualManifest(process.cwd(),pkg.version),null,2)+'\n');
          NODE
          npm run release:sync
          npm run build
      - name: Commit exact candidate package
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json COMPATIBILITY.json RELEASE_MANIFEST.json release dist src/assets/metadata
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "build: synchronize Mobility UX rc.70 visual manifest"
          git push origin HEAD:fix/rc70-shared-visual-picker
