name: Sync candidate dist

on:
  push:
    branches:
      - release/1.0.0-rc.83-unified-projection

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: release/1.0.0-rc.83-unified-projection
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Commit deterministic package and remove helper
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/sync-candidate-dist.yml
          git add dist
          git commit -m "build: commit deterministic Mobility rc.83 package"
          git push origin HEAD:release/1.0.0-rc.83-unified-projection
