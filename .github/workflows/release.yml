name: Release

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.repository }}-stable-release
  cancel-in-progress: false

jobs:
  release:
    name: Qualified stable promotion
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Full source/package validation
        run: npm test
      - name: Require completed target runtime qualification
        run: node tools/check-qualification.mjs --require-pass
      - name: Verify immutable published candidate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          TAG="v${VERSION}"
          git fetch --tags --force
          TAG_SHA=$(git rev-list -n 1 "${TAG}" 2>/dev/null || true)
          test -n "$TAG_SHA"
          RELEASE_SHA=$(gh release view "${TAG}" --json targetCommitish --jq '.targetCommitish')
          test "$(git rev-parse "$TAG_SHA")" = "$(git rev-parse "$GITHUB_SHA")"
          test "$(gh release view "${TAG}" --json isPrerelease --jq '.isPrerelease')" = true
          gh release download "${TAG}" --pattern 'rhi-mobility-ux.js' --dir /tmp/rhi-ux-release
          gh release download "${TAG}" --pattern 'rhi-mobility-ux.js.sha256' --dir /tmp/rhi-ux-release
          cmp dist/rhi-mobility-ux.js /tmp/rhi-ux-release/rhi-mobility-ux.js
          cmp dist/rhi-mobility-ux.js.sha256 /tmp/rhi-ux-release/rhi-mobility-ux.js.sha256
      - name: Promote exact candidate to stable
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          TAG="v${VERSION}"
          gh release edit "${TAG}"             --prerelease=false             --title "RHI Mobility UX ${TAG}"             --notes-file release/RELEASE_NOTES.md
          test "$(gh release view "${TAG}" --json isPrerelease --jq '.isPrerelease')" = false
      - name: Summary
        run: |
          VERSION=$(node -p "require('./package.json').version")
          {
            echo '## RHI Mobility UX stable promotion'
            echo "- Version: v${VERSION}"
            echo "- Source/package/tests: PASS"
            echo "- Target HA qualification: PASS"
            echo "- Published candidate payload: EXACT MATCH"
            echo "- Stable promotion: COMPLETE"
            echo "- Rollback: previous immutable HACS releases remain selectable"
          } >> "$GITHUB_STEP_SUMMARY"
