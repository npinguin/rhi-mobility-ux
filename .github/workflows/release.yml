name: Release

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.repository }}-stable-release
  cancel-in-progress: false

jobs:
  release:
    name: Qualified stable promotion
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout current main qualification record
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '24'
      - name: Require completed target runtime qualification
        run: node tools/check-qualification.mjs --require-pass
      - name: Verify exact immutable candidate package
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          TAG=$(node -p "require('./release/QUALIFICATION.json').candidate_tag")
          CANDIDATE_SHA=$(node -p "require('./release/QUALIFICATION.json').candidate_sha")
          test "$TAG" = "v${VERSION}"
          git fetch --tags --force
          TAG_SHA=$(git rev-list -n 1 "${TAG}" 2>/dev/null || true)
          test -n "$TAG_SHA"
          test "$TAG_SHA" = "$CANDIDATE_SHA"
          RELEASE_SHA=$(gh release view "${TAG}" --json targetCommitish --jq '.targetCommitish')
          test "$RELEASE_SHA" = "$CANDIDATE_SHA"
          test "$(gh release view "${TAG}" --json isPrerelease --jq '.isPrerelease')" = false
          test "$(gh release view "${TAG}" --json assets --jq '[.assets[].name] | index("rhi-mobility-ux.js")')" = null

          rm -rf /tmp/rhi-mobility-tag
          mkdir -p /tmp/rhi-mobility-tag
          git archive "${TAG}" dist | tar -x -C /tmp/rhi-mobility-tag
          diff -qr /tmp/rhi-mobility-tag/dist dist
          (cd /tmp/rhi-mobility-tag/dist && sha256sum -c rhi-mobility-ux.js.sha256)
      - name: Attach final qualification and promote exact candidate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG=$(node -p "require('./release/QUALIFICATION.json').candidate_tag")
          gh release upload "${TAG}" release/QUALIFICATION.json --clobber
          gh release edit "${TAG}" \
            --title "RHI Mobility UX ${TAG}" \
            --notes-file release/RELEASE_NOTES.md
      - name: Summary
        run: |
          VERSION=$(node -p "require('./package.json').version")
          CANDIDATE_SHA=$(node -p "require('./release/QUALIFICATION.json').candidate_sha")
          {
            echo '## RHI Mobility UX stable promotion'
            echo "- Version: v${VERSION}"
            echo "- Candidate SHA: ${CANDIDATE_SHA}"
            echo "- Complete tag dist package: VERIFIED"
            echo "- Rebuild during promotion: NO"
            echo "- Target HA qualification: PASS"
            echo "- Stable promotion: COMPLETE"
          } >> "$GITHUB_STEP_SUMMARY"
