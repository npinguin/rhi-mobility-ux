name: Publish HACS

on:
  push:
    branches: [main]
    paths:
      - 'dist/**'
      - 'hacs.json'
      - 'COMPATIBILITY.json'
      - 'RELEASE_MANIFEST.json'
      - 'release/RELEASE_NOTES.md'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.repository }}-publish-candidate
  cancel-in-progress: false

jobs:
  verify:
    name: Verify validated HACS package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact main candidate
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '24'
      - name: Reject immutable version republish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          TAG="v${VERSION}"
          git fetch --tags --force
          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null || gh release view "${TAG}" >/dev/null 2>&1; then
            echo "Immutable candidate ${TAG} already exists; refusing republish." >&2
            exit 1
          fi
      - name: Verify committed package and release metadata
        run: |
          node tools/verify-dist.mjs
          node tools/check-hacs-package.mjs
          node tests/package/hacs-install-simulation.mjs
          node tools/check-release-governance.mjs
          node tools/check-qualification.mjs
      - name: HACS validation
        uses: hacs/action@885037da508419fd08c13515967aec868dfdee2d
        with:
          category: plugin

  publish:
    name: Publish immutable TEST CANDIDATE tag
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '24'
      - name: Verify exact committed HACS package
        run: |
          node tools/verify-dist.mjs
          node tools/check-hacs-package.mjs
      - name: Publish immutable tag and evidence-only release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          TAG="v${VERSION}"
          git fetch --tags --force
          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null || gh release view "${TAG}" >/dev/null 2>&1; then
            echo "Immutable candidate ${TAG} already exists; refusing republish." >&2
            exit 1
          fi
          git tag "${TAG}" "$GITHUB_SHA"
          git push origin "${TAG}"
          gh release create "${TAG}" \
            --target "$GITHUB_SHA" \
            --title "RHI Mobility UX ${TAG} — TEST CANDIDATE" \
            --notes-file release/RELEASE_NOTES.md \
            dist/rhi-mobility-ux.js.sha256 \
            dist/PACKAGE_MANIFEST.json \
            COMPATIBILITY.json \
            RELEASE_MANIFEST.json \
            release/QUALIFICATION.json
          test "$(gh release view "${TAG}" --json isPrerelease --jq '.isPrerelease')" = false
          test "$(gh release view "${TAG}" --json assets --jq '[.assets[].name] | index("rhi-mobility-ux.js")')" = null
      - name: Summary
        run: |
          VERSION=$(node -p "require('./package.json').version")
          {
            echo '## RHI Mobility UX HACS publication'
            echo "- Version: v${VERSION}"
            echo "- HACS install source: immutable tag dist/ tree"
            echo "- GitHub Release assets: evidence only"
            echo "- JS release asset: NOT PRESENT (prevents HACS single-file mode)"
            echo "- Rebuild during publication: NO"
            echo "- Immutable HACS-visible TEST CANDIDATE: PUBLISHED"
          } >> "$GITHUB_STEP_SUMMARY"
