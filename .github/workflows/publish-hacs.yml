name: Publish HACS

on:
  push:
    branches: [main]
    paths:
      - 'dist/**'
      - 'hacs.json'
      - 'COMPATIBILITY.json'
      - 'RELEASE_MANIFEST.json'
      - 'release/RELEASE_NOTES.md'
      - '.github/workflows/publish-hacs.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.repository }}-publish-candidate
  cancel-in-progress: false

jobs:
  verify:
    name: Verify validated HACS package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact main candidate
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '24'
      - name: Verify committed package and release metadata
        run: |
          node tools/verify-dist.mjs
          node tools/check-hacs-package.mjs
          node tests/package/hacs-install-simulation.mjs
          node tools/check-release-governance.mjs
          node tools/check-qualification.mjs
      - name: Verify immutable candidate state
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          TAG="v${VERSION}"
          git fetch --tags --force

          TAG_EXISTS=false
          RELEASE_EXISTS=false
          git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null && TAG_EXISTS=true
          gh release view "${TAG}" >/dev/null 2>&1 && RELEASE_EXISTS=true

          if [ "$RELEASE_EXISTS" = true ] && [ "$TAG_EXISTS" != true ]; then
            echo "Release ${TAG} exists without immutable tag." >&2
            exit 1
          fi

          if [ "$TAG_EXISTS" = true ]; then
            rm -rf /tmp/rhi-mobility-existing-tag
            mkdir -p /tmp/rhi-mobility-existing-tag
            git archive "${TAG}" dist | tar -x -C /tmp/rhi-mobility-existing-tag
            diff -qr /tmp/rhi-mobility-existing-tag/dist dist
            echo "Existing immutable tag package matches current dist."
          fi

          if [ "$RELEASE_EXISTS" = true ]; then
            TAG_SHA=$(git rev-list -n 1 "${TAG}")
            RELEASE_SHA=$(gh release view "${TAG}" --json targetCommitish --jq '.targetCommitish')
            test "$RELEASE_SHA" = "$TAG_SHA"
            test "$(gh release view "${TAG}" --json isPrerelease --jq '.isPrerelease')" = false
            if gh release view "${TAG}" --json assets --jq '.assets[].name' | grep -Fxq 'rhi-mobility-ux.js'; then
              echo "Forbidden JS release asset present; HACS would use single-file mode." >&2
              exit 1
            fi
          fi
      - name: HACS validation
        uses: hacs/action@885037da508419fd08c13515967aec868dfdee2d
        with:
          category: plugin

  publish:
    name: Publish or verify immutable TEST CANDIDATE
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '24'
      - name: Verify exact committed HACS package
        run: |
          node tools/verify-dist.mjs
          node tools/check-hacs-package.mjs
      - name: Publish or verify immutable tag and evidence-only release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          TAG="v${VERSION}"
          git fetch --tags --force

          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            TAG_SHA=$(git rev-list -n 1 "${TAG}")
            rm -rf /tmp/rhi-mobility-existing-tag
            mkdir -p /tmp/rhi-mobility-existing-tag
            git archive "${TAG}" dist | tar -x -C /tmp/rhi-mobility-existing-tag
            diff -qr /tmp/rhi-mobility-existing-tag/dist dist
            echo "Immutable tag ${TAG} already exists with identical package bytes."
          else
            TAG_SHA="$GITHUB_SHA"
            git tag "${TAG}" "$TAG_SHA"
            git push origin "${TAG}"
          fi

          if gh release view "${TAG}" >/dev/null 2>&1; then
            RELEASE_SHA=$(gh release view "${TAG}" --json targetCommitish --jq '.targetCommitish')
            test "$RELEASE_SHA" = "$TAG_SHA"
            echo "GitHub Release ${TAG} already exists; verifying without mutation."
          else
            gh release create "${TAG}" \
              --target "$TAG_SHA" \
              --title "RHI Mobility UX ${TAG} — TEST CANDIDATE" \
              --notes-file release/RELEASE_NOTES.md \
              dist/rhi-mobility-ux.js.sha256 \
              dist/PACKAGE_MANIFEST.json \
              COMPATIBILITY.json \
              RELEASE_MANIFEST.json \
              release/QUALIFICATION.json
          fi

          test "$(gh release view "${TAG}" --json isPrerelease --jq '.isPrerelease')" = false

          if gh release view "${TAG}" --json assets --jq '.assets[].name' | grep -Fxq 'rhi-mobility-ux.js'; then
            echo "Forbidden JS release asset present; HACS would use single-file mode." >&2
            exit 1
          fi

          for REQUIRED in rhi-mobility-ux.js.sha256 PACKAGE_MANIFEST.json COMPATIBILITY.json RELEASE_MANIFEST.json QUALIFICATION.json; do
            gh release view "${TAG}" --json assets --jq '.assets[].name' | grep -Fxq "$REQUIRED"
          done
      - name: Summary
        run: |
          VERSION=$(node -p "require('./package.json').version")
          {
            echo '## RHI Mobility UX HACS publication'
            echo "- Version: v${VERSION}"
            echo "- HACS install source: immutable tag dist/ tree"
            echo "- GitHub Release assets: evidence only"
            echo "- JS release asset: NOT PRESENT (prevents HACS single-file mode)"
            echo "- Existing identical candidate: verified idempotently"
            echo "- Rebuild during publication: NO"
            echo "- Immutable HACS-visible TEST CANDIDATE: READY"
          } >> "$GITHUB_STEP_SUMMARY"
