name: Prepare Mobility UX mobile candidate
on:
  push:
    branches: [fix/mobile-ux-layout-20261012]
    paths: [.github/workflows/prepare-mobile-candidate.yml]
permissions:
  contents: write
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: fix/mobile-ux-layout-20261012
          fetch-depth: 0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Prepare candidate version and human notes
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const p='release/product.json';
          const obj=JSON.parse(fs.readFileSync(p,'utf8'));
          obj.version='1.0.0-rc.93';
          obj.rollback_release='v1.0.0-rc.92';
          fs.writeFileSync(p,JSON.stringify(obj,null,2)+'\n');
          const rn='release/RELEASE_NOTES.md';
          const notes=fs.readFileSync(rn,'utf8');
          fs.writeFileSync(rn,'# v1.0.0-rc.93 — Mobile layout recovery (TEST CANDIDATE)\n\n- Restore readable vehicle facts and bound vehicle artwork on narrow phones.\n- Preserve canonical V2 commands and backend-owned semantics.\n- Target HA qualification remains pending; Overview and Chargers require further visual acceptance.\n\n'+notes);
          const cp='CHANGELOG.md';
          const ch=fs.readFileSync(cp,'utf8');
          const head='## 1.0.0-rc.93\n\n- Mobile Vehicles responsive layout and contract-test governance correction.\n\n';
          const m=ch.match(/^##\s+/m);
          fs.writeFileSync(cp,m?ch.slice(0,m.index)+head+ch.slice(m.index):head+ch);
          NODE
          npm run release:sync
      - name: Generate exact distributable package
        run: |
          npm run clean
          npm run build
          npm run check:syntax
      - name: Commit generated candidate and remove one-time workflow
        run: |
          git rm .github/workflows/prepare-mobile-candidate.yml
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'build(mobility): prepare reproducible rc93 candidate package'
          git push origin HEAD:fix/mobile-ux-layout-20261012
