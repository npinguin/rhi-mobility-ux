name: Prepare unified UX release package
on:
  push:
    branches:
      - release/1.0.0-rc.65-unified-ux
permissions:
  contents: write
jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: release/1.0.0-rc.65-unified-ux
          fetch-depth: 0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '24'
      - run: npm ci
      - name: Synchronize release metadata and build package
        run: |
          npm run release:sync
          npm run build
      - name: Commit deterministic package
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json COMPATIBILITY.json RELEASE_MANIFEST.json release/product.json release/RELEASE_STATUS.json release/QUALIFICATION.json dist
          if git diff --cached --quiet; then
            echo "Package already synchronized."
            exit 0
          fi
          git commit -m "build: synchronize unified UX release package"
          git push origin HEAD:release/1.0.0-rc.65-unified-ux
