name: Materialize rc42 dist

on:
  push:
    branches:
      - fix/rc42-picker-write-refresh
    paths:
      - .github/workflows/materialize-rc42-dist.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: fix/rc42-picker-write-refresh
          fetch-depth: 0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run clean
      - run: npm run build
      - name: Commit deterministic dist
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist
          if git diff --cached --quiet; then
            echo "dist already current"
            exit 0
          fi
          git commit -m "Materialize rc.42 deterministic dist"
          git push origin HEAD:fix/rc42-picker-write-refresh
