name: Sync Mobility rc68 candidate

on:
  push:
    branches:
      - fix/path-relative-dashboard-and-install-docs

permissions:
  contents: write

jobs:
  build-and-sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/path-relative-dashboard-and-install-docs
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Commit deterministic dist
        run: |
          if git diff --quiet -- dist; then
            echo "dist already synchronized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist
          git commit -m "Build Mobility UX rc.68 deterministic HACS package"
          git push
