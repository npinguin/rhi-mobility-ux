name: Validate

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.repository }}-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  source:
    name: Source / package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Full validation
        run: npm test
      - name: Protect immutable published runtime
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          TAG="v${VERSION}"
          if git ls-remote --exit-code --tags "https://github.com/${GITHUB_REPOSITORY}.git" "refs/tags/${TAG}" >/dev/null 2>&1; then
            git fetch --tags --force
            git show "${TAG}:dist/rhi-mobility-ux.js" > /tmp/published-rhi-mobility-ux.js
            git show "${TAG}:dist/rhi-mobility-ux.js.sha256" > /tmp/published-rhi-mobility-ux.js.sha256
            cmp /tmp/published-rhi-mobility-ux.js dist/rhi-mobility-ux.js
            cmp /tmp/published-rhi-mobility-ux.js.sha256 dist/rhi-mobility-ux.js.sha256
            echo "${TAG} already exists; runtime bytes are unchanged, so governance/test/documentation refactoring is allowed."
          else
            echo "${TAG} is not published yet; candidate runtime may advance before first publication."
          fi
      - name: Deterministic two-build proof
        shell: bash
        run: |
          set -euo pipefail
          cp dist/rhi-mobility-ux.js /tmp/rhi-ux-first.js
          cp dist/rhi-mobility-ux.js.sha256 /tmp/rhi-ux-first.sha256
          npm run clean
          npm run build
          cmp /tmp/rhi-ux-first.js dist/rhi-mobility-ux.js
          cmp /tmp/rhi-ux-first.sha256 dist/rhi-mobility-ux.js.sha256
      - name: Verify committed runtime matches clean build
        run: git diff --exit-code -- dist/rhi-mobility-ux.js dist/rhi-mobility-ux.js.sha256 dist/assets assets

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: HACS validation
        uses: hacs/action@885037da508419fd08c13515967aec868dfdee2d
        with:
          category: plugin

  gate:
    name: RHI UX / Validate
    if: always()
    needs: [source, hacs]
    runs-on: ubuntu-latest
    steps:
      - name: Require all gates
        env:
          SOURCE: ${{ needs.source.result }}
          HACS: ${{ needs.hacs.result }}
        run: |
          set -euo pipefail
          test "$SOURCE" = success
          test "$HACS" = success
      - name: Summary
        if: always()
        env:
          SOURCE: ${{ needs.source.result }}
          HACS: ${{ needs.hacs.result }}
        run: |
          {
            echo '## RHI Mobility UX validation'
            echo "- Commit: ${GITHUB_SHA}"
            echo "- Candidate build + tests: ${SOURCE}"
            echo "- Deterministic rebuild proof: included in source gate"
            echo "- HACS: ${HACS}"
            echo "- Publication rebuilds: none"
          } >> "$GITHUB_STEP_SUMMARY"
