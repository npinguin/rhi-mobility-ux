name: Materialize rc36 dist

on:
  push:
    branches:
      - fix/rc36-hero-double-resolution

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: fix/rc36-hero-double-resolution
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Build deterministic dist
        run: |
          npm run clean
          npm run build
      - name: Commit deterministic dist
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist
          if git diff --cached --quiet; then
            echo "dist already materialized"
          else
            git commit -m "rc.36: materialize hero URL hotfix dist"
            git push origin HEAD:fix/rc36-hero-double-resolution
          fi
